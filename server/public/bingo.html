<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    table { border-collapse: collapse; margin: auto; }
    td { border: 1px solid #ccc; width: 40px; height: 40px; text-align: center; }
    td.marcado { background: #4caf50; color: white; }
  </style>
</head>
<body>
  <div class="container" id="menuBingo">
    <h1>Bingo</h1>
    <input type="text" id="nameInput" placeholder="Nombre">
    <button id="createRoomBtn">Crear Sala</button>
    <div class="join-section">
      <input type="text" id="roomInput" placeholder="Código" maxlength="5">
      <button id="joinRoomBtn">Unirse</button>
    </div>
  </div>

  <div class="container hidden" id="gameBingo">
    <h2>Sala: <span id="roomCode"></span></h2>
    <p id="ultimoNumero"></p>
    <table id="tablero"></table>
    <p id="mensaje"></p>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="bingo.js"></script>
</body>
</html>
